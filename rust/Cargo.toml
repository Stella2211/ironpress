[package]
name = "ironpress_native"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Native Rust image compression engine for Flutter"

[lib]
name = "ironpress"
crate-type = ["cdylib", "staticlib"]

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
zune-jpeg = "0.5.15"
mozjpeg-rs = "0.9.2"
oxipng = { version = "10.2.1", default-features = false, features = ["parallel"] }
webpx = "0.4.0"
rayon = "1.12.0"
libc = "0.2.189"
fast_image_resize = "6.1.0"

[profile.release]
opt-level = 3            # Optimize for throughput
lto = "fat"              # Full LTO for best cross-crate inlining (mozjpeg+image+oxipng)
codegen-units = 1        # Better code generation at the cost of compile time
panic = "unwind"         # Required for catch_unwind (batch crash safety)
strip = true             # Strip symbols from binary

[profile.release.package."*"]
opt-level = 3
