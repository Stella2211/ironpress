name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  # ─── Dart / Flutter unit + integration tests ─────────────────────────────
  dart-tests:
    name: Dart tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # mozjpeg requires nasm for its assembly routines
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Build Linux native library
        working-directory: rust
        run: cargo build --release

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Run unit tests
        run: flutter test test/ironpress_test.dart test/options_test.dart

      - name: Run integration tests (with native library)
        run: flutter test --dart-define=IRONPRESS_NATIVE_REQUIRED=true test/integration_test.dart
        env:
          # Make the compiled .so discoverable by DynamicLibrary.open()
          LD_LIBRARY_PATH: ${{ github.workspace }}/rust/target/release

  # ─── Rust tests ──────────────────────────────────────────────────────────
  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Run Rust tests
        working-directory: rust
        run: cargo test

      - name: Check Rust formatting
        working-directory: rust
        run: cargo fmt --check

      - name: Clippy lint
        working-directory: rust
        run: cargo clippy -- -D warnings

      - name: Install cargo-audit
        working-directory: rust
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        working-directory: rust
        run: cargo audit

  # ─── Pub publish dry-run ─────────────────────────────────────────────────
  windows-desktop-smoke:
    name: Desktop smoke (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Test the library built from this commit. The committed DLL is only
      # regenerated by the Build Native Libraries workflow, so it can lag
      # behind the sources (e.g. across an ABI bump).
      - name: Build Windows library from source
        working-directory: rust
        run: cargo build --release

      - name: Use freshly built library
        shell: bash
        run: cp rust/target/release/ironpress.dll windows/libs/ironpress.dll

      - name: Smoke test Windows library
        run: flutter test --dart-define=IRONPRESS_NATIVE_REQUIRED=true test/integration_test.dart --plain-name "produces non-empty output with valid stats"

  macos-desktop-smoke:
    name: Desktop smoke (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Test the library built from this commit. The committed xcframework is
      # only regenerated by the Build Native Libraries workflow, so it can lag
      # behind the sources (e.g. across an ABI bump). `flutter` is a shell
      # script, so SIP strips DYLD_* variables; swap the binary in place.
      - name: Build macOS library from source
        working-directory: rust
        run: cargo build --release

      - name: Use freshly built library
        run: |
          fw=darwin/ironpress/Frameworks/ironpress_native.xcframework/macos-arm64_x86_64/ironpress_native.framework
          cp rust/target/release/libironpress.dylib "$fw/Versions/A/ironpress_native"
          install_name_tool -id @rpath/ironpress_native.framework/Versions/A/ironpress_native "$fw/Versions/A/ironpress_native"
          codesign --force --sign - "$fw"

      - name: Smoke test macOS library
        run: flutter test --dart-define=IRONPRESS_NATIVE_REQUIRED=true test/integration_test.dart --plain-name "produces non-empty output with valid stats"

  darwin-integration:
    name: Darwin example build (${{ matrix.integration }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        integration: [swiftpm, cocoapods]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Select dependency manager
        run: |
          if [ "${{ matrix.integration }}" = "swiftpm" ]; then
            flutter config --enable-swift-package-manager
          else
            flutter config --no-enable-swift-package-manager
          fi

      - name: Generate example platform runners
        working-directory: example
        run: flutter create --platforms=ios,macos --org dev.rickyirfandi .

      - name: Build macOS and iOS simulator
        working-directory: example
        run: |
          set -o pipefail
          flutter build macos --debug 2>&1 | tee build.log
          flutter build ios --simulator --debug 2>&1 | tee -a build.log
          if grep -q "Plugin ironpress" build.log; then
            echo "::error::Flutter reported a Swift Package Manager issue for ironpress"
            exit 1
          fi

      - name: Verify embedded framework
        working-directory: example
        run: |
          set -e
          mac_fw=$(echo build/macos/Build/Products/Debug/*.app/Contents/Frameworks/ironpress_native.framework)
          ios_fw=build/ios/iphonesimulator/Runner.app/Frameworks/ironpress_native.framework
          codesign --verify --strict "$mac_fw"
          codesign --verify --strict "$ios_fw"
          plutil -p "$ios_fw/Info.plist" | grep MinimumOSVersion
          if [ "${{ matrix.integration }}" = "swiftpm" ]; then
            test ! -f macos/Podfile.lock
          else
            grep -q "ironpress" macos/Podfile.lock
          fi

  publish-check:
    name: pub publish --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Dry-run publish
        run: flutter pub publish --dry-run
